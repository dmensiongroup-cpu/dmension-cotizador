nav{background:#1A1A1A;height:56px;display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.logo{background:#F5A800;border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;cursor:pointer}
.brand{color:#fff;font-weight:800;font-size:15px;cursor:pointer}.brand span{color:#F5A800}
nav button{margin-left:auto;background:#F5A800;border:none;border-radius:6px;padding:8px 16px;font-weight:700;font-size:13px;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:24px 16px 60px}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,.07);padding:20px;margin-bottom:16px}
h2{font-size:22px;font-weight:800;margin-bottom:4px}
h3{font-size:16px;font-weight:800;margin-bottom:16px}
.sub{font-size:13px;color:#5A5A5A;margin-bottom:20px}
label{font-size:11px;font-weight:700;color:#5A5A5A;text-transform:uppercase;letter-spacing:.8px;display:block;margin-bottom:4px}
input,select{width:100%;background:#fff;border:1.5px solid #E8E8E8;border-radius:6px;padding:9px 12px;font-size:14px;font-family:inherit;outline:none;color:#1A1A1A}
input:focus,select:focus{border-color:#F5A800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}
.btn{background:#F5A800;border:none;border-radius:6px;padding:10px 22px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.btn-sec{background:#2D2D2D;color:#fff}
.btn-sm{padding:6px 14px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:4px;border-bottom:2px solid #E8E8E8;margin-bottom:24px}
.tab{background:none;border:none;padding:10px 16px;font-family:inherit;font-size:13px;font-weight:500;color:#5A5A5A;cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-2px}
.tab.active{font-weight:800;color:#1A1A1A;border-bottom-color:#F5A800}
.filters{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.filt{background:#E8E8E8;border:none;border-radius:4px;padding:3px 9px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.filt.on{background:#1A1A1A;color:#fff}
.list{max-height:210px;overflow-y:auto;border:1.5px solid #E8E8E8;border-radius:8px;margin-bottom:10px}
.list-item{padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #E8E8E8;transition:background .1s}
.list-item:hover{background:#fffbf0}
.list-item.sel{background:#F5A80022}
.chk{width:14px;height:14px;border-radius:3px;border:2px solid #5A5A5A;flex-shrink:0;margin-right:8px;display:inline-block}
.chk.on{background:#F5A800;border-color:#D4900A}
.iname{font-size:12px;flex:1}
.iname.on{font-weight:700}
.iprice{font-size:11px;color:#5A5A5A;flex-shrink:0;margin-left:8px}
.preview{background:#F5A80022;border:1.5px solid #F5A800;border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:#5A5A5A}
.preview strong{color:#1A1A1A;font-size:16px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px}
.tag{background:#F5A80033;border-radius:4px;padding:2px 7px;font-size:11px;font-weight:600}
.item-row{padding:12px 0;border-bottom:1px solid #E8E8E8;display:flex;align-items:flex-start;gap:12px}
.item-row:last-child{border-bottom:none}
.del{background:none;border:none;cursor:pointer;color:#E53E3E;font-size:18px;padding:0 4px}
.total-bar{background:#F5A800;border-radius:8px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;font-weight:800}
.total-bar span:last-child{font-size:22px;font-weight:900}
.cot-card{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.07);padding:16px 20px;display:flex;align-items:center;gap:16px;cursor:pointer;margin-bottom:10px}
.cot-num{background:#F5A800;border-radius:8px;min-width:44px;width:auto;padding:4px 8px;height:44px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;flex-shrink:0;text-align:center;white-space:nowrap}
.empty{text-align:center;padding:60px 0;color:#5A5A5A}
.empty .icon{font-size:48px;margin-bottom:12px}
.sel-box{background:#E8E8E8;border-radius:8px;padding:10px 14px;margin-bottom:14px}
.sel-box p{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#5A5A5A;margin-bottom:6px}
.sel-tag{display:inline-flex;align-items:center;background:#fff;border:1px solid #F5A800;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600;margin:2px}
.sum-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid #E8E8E8}
.sum-sub{display:flex;justify-content:flex-end;padding:8px 0;font-size:13px;font-weight:700}
.info-box{background:#E8E8E8;border-radius:8px;padding:14px 16px}
.info-box .lbl{font-size:11px;color:#5A5A5A;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.info-box .val{font-weight:700;font-size:15px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}}
</style>

</div>

function calcCorte(item,tc){
  const precioMin=CORTE_PRECIOS[tc]||CORTE_PRECIOS.tipo2;
  if(item.subTipo==='laser'){
    return (parseFloat(item.minutos)||0)*precioMin;
  }
  if(item.subTipo==='cnc'){
    const dist=(parseFloat(item.distancia)||0)*10; // cm a mm
    const speed=parseFloat(item.speed)||15;
    const pasadas=parseInt(item.pasadas)||1;
    const segundos=(dist/speed)*pasadas;
    const minutos=segundos/60;
    return minutos*precioMin;
  }
  return 0;
}

function calcMinutosCNC(distancia,speed,pasadas){
  const dist=(parseFloat(distancia)||0)*10;
  const spd=parseFloat(speed)||15;
  const pas=parseInt(pasadas)||1;
  return (dist/spd)*pas/60;
}

function comprimirImagen(file, callback){
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      const canvas=document.createElement('canvas');
      const MAX=300;
      let w=img.width, h=img.height;
      if(w>h){if(w>MAX){h=h*(MAX/w);w=MAX;}}else{if(h>MAX){w=w*(MAX/h);h=MAX;}}
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      callback(canvas.toDataURL('image/jpeg',0.7));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function subirImagenItem(itemId){
  const input=document.createElement('input');
  input.type='file';input.accept='image/*';
  input.onchange=function(e){
    const file=e.target.files[0];
    if(!file)return;
    comprimirImagen(file,function(b64){
      const idx=cur.items.findIndex(i=>i.id===itemId);
      if(idx>-1){cur.items[idx].img=b64;render();}
    });
  };
  input.click();
}

function quitarImagenItem(itemId){
  const idx=cur.items.findIndex(i=>i.id===itemId);
  if(idx>-1){delete cur.items[idx].img;render();}
}

  editandoDesc=itemId;

  const item=cur.items.find(i=>i.id===itemId);
  if(item&&!item.descCustom){
    if(item.tipo==='vinilo') item.descCustom=item.subs.map(s=>s.n).join(' + ');

async function syncPreciosFromGS(){
  showSyncMsg('Sincronizando precios...');
  const r=await gsCall({action:'getPrecios'});
  if(r.procesos||r.materiales||r.papeles||r.acabados){
    const tam=['carta','oficio','extraoficio','tabloide','extratabloide','supertabloide'];
    if(r.procesos&&r.procesos.length) r.procesos.forEach(p=>{const item=PR.find(x=>x.id===p.id);if(item){item.n=p.n;item.p=parseFloat(p.p)||item.p;item.cat=p.cat||item.cat;}});
    if(r.materiales&&r.materiales.length) r.materiales.forEach(m=>{const item=MT.find(x=>x.id===m.id);if(item){item.n=m.n;item.p=parseFloat(m.p)||item.p;item.c=m.c||item.c;}});
    if(r.papeles&&r.papeles.length) r.papeles.forEach(p=>{if(LPAP[p.fi]&&LPAP[p.fi].g[p.gi]){const g=LPAP[p.fi].g[p.gi];tam.forEach(t=>{if(p[t])g.p[t]=parseFloat(p[t])||0;});}});
    if(r.acabados&&r.acabados.length) r.acabados.forEach(a=>{const item=ACABADOS.find(x=>x.id===a.id);if(item){tam.forEach(t=>{if(a[t])item.p[t]=parseFloat(a[t])||0;});}});
    await savePreciosLocal();
  }
  hideSyncMsg();
}

async function pushPreciosToGS(){
  const tam=['carta','oficio','extraoficio','tabloide','extratabloide','supertabloide'];
  const procesos=PR.map(p=>({id:p.id,cat:p.cat,n:p.n,p:p.p}));
  const materiales=MT.map(m=>({id:m.id,c:m.c,n:m.n,p:m.p}));
  const papeles=LPAP.flatMap((fam,fi)=>fam.g.map((gr,gi)=>({fi,gi,familia:fam.f,gramaje:gr.gr||'',...Object.fromEntries(tam.map(t=>[t,gr.p[t]||0]))})));
  const acabados=ACABADOS.map(a=>({id:a.id,n:a.n,...Object.fromEntries(tam.map(t=>[t,a.p[t]||0]))}));
  await gsCall({action:'saveProcesos',data:procesos});
  await gsCall({action:'saveMateriales',data:materiales});
  await gsCall({action:'savePapeles',data:papeles});
  await gsCall({action:'saveAcabados',data:acabados});
}

// ── CORTE LASER Y CNC ────────────────────────────────────────────
function calcCorte(item,tc){
  const precioMin=CORTE_PRECIOS[tc]||CORTE_PRECIOS.tipo2;
  if(item.subTipo==='laser'){
    return (parseFloat(item.minutos)||0)*precioMin;
  }
  if(item.subTipo==='cnc'){
    const dist=(parseFloat(item.distancia)||0)*10; // cm a mm
    const speed=parseFloat(item.speed)||15;
    const pasadas=parseInt(item.pasadas)||1;
    const segundos=(dist/speed)*pasadas;
    const minutos=segundos/60;
    return minutos*precioMin;
  }
  return 0;
}

function calcMinutosCNC(distancia,speed,pasadas){
  const dist=(parseFloat(distancia)||0)*10;
  const spd=parseFloat(speed)||15;
  const pas=parseInt(pasadas)||1;
  return (dist/spd)*pas/60;
}

// ── PRECIOS LOCAL STORAGE ────────────────────────────────────────
async function loadPreciosLocal(){
  try {
    if(!window.storage)return;
    const r=await window.storage.get(SK_PRECIOS);
    if(r){
      const data=JSON.parse(r.value);
      if(data.procesos&&data.procesos.length) data.procesos.forEach(p=>{const item=PR.find(x=>x.id===p.id);if(item){item.n=p.n;item.p=p.p;item.cat=p.cat;}});
      if(data.materiales&&data.materiales.length) data.materiales.forEach(m=>{const item=MT.find(x=>x.id===m.id);if(item){item.n=m.n;item.p=m.p;item.c=m.c;}});
      if(data.papeles&&data.papeles.length) data.papeles.forEach(p=>{if(LPAP[p.fi]&&LPAP[p.fi].g[p.gi]){const g=LPAP[p.fi].g[p.gi];['carta','oficio','extraoficio','tabloide','extratabloide','supertabloide'].forEach(t=>{if(p[t]!==undefined)g.p[t]=parseFloat(p[t])||0;});}});
      if(data.acabados&&data.acabados.length) data.acabados.forEach(a=>{const item=ACABADOS.find(x=>x.id===a.id);if(item){item.n=a.n;['carta','oficio','extraoficio','tabloide','extratabloide','supertabloide'].forEach(t=>{if(a[t]!==undefined)item.p[t]=parseFloat(a[t])||0;});}});
    }
  } catch(e){console.error('loadPreciosLocal:',e);}
}

async function savePreciosLocal(){
  try {
    const tam=['carta','oficio','extraoficio','tabloide','extratabloide','supertabloide'];
    const data={
      procesos:PR.map(p=>({id:p.id,cat:p.cat,n:p.n,p:p.p})),
      materiales:MT.map(m=>({id:m.id,c:m.c,n:m.n,p:m.p})),
      papeles:LPAP.flatMap((fam,fi)=>fam.g.map((gr,gi)=>({fi,gi,familia:fam.f,gramaje:gr.gr,...Object.fromEntries(tam.map(t=>[t,gr.p[t]||0]))}))),
      acabados:ACABADOS.map(a=>({id:a.id,n:a.n,...Object.fromEntries(tam.map(t=>[t,a.p[t]||0]))}))
    };
    if(window.storage)await window.storage.set(SK_PRECIOS,JSON.stringify(data));
  } catch(e){console.error('savePreciosLocal:',e);}
}

// ── GOOGLE SHEETS SYNC ───────────────────────────────────────────
const GS_URL='https://script.google.com/macros/s/AKfycbwMTs0tbn4wWmnuNNzt6uxmOQ1O-GDpHbKlwHamAj50L5zm5WmO48y_5m2BAQH5-DKxLQ/exec';

async function gsCall(params){
  try{
    // Use POST for large data, GET for simple queries
    const hasLargeData=params.data&&JSON.stringify(params.data).length>1000;
    if(hasLargeData){
      const formData=new FormData();
      Object.entries(params).forEach(([k,v])=>formData.append(k,typeof v==='object'?JSON.stringify(v):v));
      const r=await fetch(GS_URL,{method:'POST',body:formData});
      return await r.json();
    } else {
      const url=GS_URL+'?'+Object.entries(params).map(([k,v])=>k+'='+encodeURIComponent(typeof v==='object'?JSON.stringify(v):v)).join('&');
      const r=await fetch(url);
      return await r.json();
    }
  }catch(e){console.error('GS error:',e);return {error:e.toString()};}
}

async function syncClientes(){
  showSyncMsg('Sincronizando clientes...');
  const r=await gsCall({action:'getClientes'});
  if(r.data){
    const fromGS=r.data;
    const gsIds=new Set(fromGS.map(c=>c.id));
    const localOnly=clientes.filter(c=>!gsIds.has(c.id));
    clientes=[...fromGS,...localOnly];
    await saveClientes();
    if(localOnly.length) await gsCall({action:'saveClientes',data:clientes});
  }
  hideSyncMsg();
}

async function syncCotizaciones(){
  showSyncMsg('Sincronizando cotizaciones...');
  const r=await gsCall({action:'getCotizaciones'});
  if(r.data){
    const fromGS=r.data.map(c=>({...c,items:typeof c.items==='string'?JSON.parse(c.items||'[]'):c.items||[]}));
    const gsIds=new Set(fromGS.map(c=>c.id));
    // Keep local cots that haven't made it to GS yet
    const localOnly=cots.filter(c=>!gsIds.has(c.id));
    cots=[...fromGS,...localOnly];
    if(cots.length)cnt=Math.max(...cots.map(c=>parseInt(c.num)||0))+1;
    await saveCots();
    // Push local-only cots to GS
    for(const c of localOnly) await pushCotizacionToGS(c);
  }
  hideSyncMsg();
}

async function pushClientesToGS(){

}

function calcI_otros(item,d){
  const base=(parseFloat(item.precioUnit)||0)*(parseInt(item.cant)||1);
  const mo=item.manoObra?item.manoObra.total:0;
  return base+mo;
}

function calcRefilados(item,d){
  return (item.refilados||[]).reduce((s,r)=>s+r.cortes*r.costo*d,0);
}
function toMetros(val, unit){ return unit==='m' ? parseFloat(val)||0 : (parseFloat(val)||0)/100; }
function calcCintas(item,d){
  return (item.cintas||[]).reduce((s,c)=>s+c.metros*c.base*d,0);
}
function calcManoObra(item,d){
  return item.manoObra?item.manoObra.total*d:0;
}
function calcEmpaque(item){
  const d=DESC.tipo1; // siempre cliente frecuente
  const carton=CARTONES.find(c=>c.id===item.cartonId)||CARTONES[0];
  // Calculo de laminas: desarrollado de caja = 2*(largo+alto) x (ancho+alto) aprox
  const largo=parseFloat(item.largo)||0;
  const ancho=parseFloat(item.ancho)||0;
  const alto=parseFloat(item.alto)||0;
  const devW=2*(largo+alto)+2; // cm ancho desarrollo + solapas
  const devH=ancho+alto+2;     // cm alto desarrollo + solapas
  const lamW=carton.lamW||1;
  const lamH=carton.lamH||1;
  const fraccion=Math.ceil((devW*devH)/(lamW*lamH)*1.40*100)/100; // +20% desperdicio
  const costoCarton=fraccion*carton.precio*(parseInt(item.cant)||1)*d;
  // Vinipel: se calcula por area de desarrollo de la caja
  const vinipelPrecioM2=VINIPEL.precio/(VINIPEL.lamW*VINIPEL.lamH);
  const costoVinipel=item.vinipel?Math.ceil(devW*devH*3*vinipelPrecioM2*100)/100*(parseInt(item.cant)||1)*d:0;
  const moH=(parseFloat(item.manoObra?.horas)||0)+(parseFloat(item.manoObra?.minutos)||0)/60;
  const costoMO=moH*35000*d;
  return {costoCarton,costoVinipel,costoMO,fraccion,total:costoCarton+costoVinipel+costoMO};
}

function calcI(item,d){
  if(item.tipo==="otros") return calcI_otros(item,d);
  if(item.tipo==="empaque") return calcEmpaque(item).total;
  if(item.tipo==="empaque_mat") return (parseFloat(item.precioUnit)||0)*(parseInt(item.cant)||1)*DESC.tipo1;
  if(item.tipo==="corte") return calcCorte(item,d);
  if(item.tipo==="vinilo"){
    const cm2=item.ancho*item.alto*(item.unid||1);
    const base=item.subs.reduce((s,si)=>s+cm2*si.p*(si.dosCaras?2:1),0)*(item.cant||1)*d;
    return base+calcRefilados(item,d)+calcCintas(item,d)+calcManoObra(item,d);
  }
  if(item.tipo==="laser"){
    const base=(LBASE[item.mod]?.[item.tam]||0)+(item.pPap||0);
    const acabadosTotal=(item.acabados||[]).reduce((s,a)=>s+(a.p||0),0);
    return(base+acabadosTotal)*(item.cant||1)*d+calcRefilados(item,d)+calcCintas(item,d)+calcManoObra(item,d);
  }
  return 0;
}
function calcT(c){const d=DESC[c.tc]||1;return(c.items||[]).reduce((s,i)=>s+calcI(i,d),0);}

function render(){
  // Save scroll positions of all lists before re-render
  const scrolls={};
  document.querySelectorAll('.list').forEach(el=>{if(el.id)scrolls[el.id]=el.scrollTop;});

  document.getElementById('btnNueva').style.display=(screen==='lista'&&!adminMode)?'':'none';
  document.getElementById('btnAdmin').textContent=adminMode?'🔓 Salir admin':'⚙️ Admin';
  document.getElementById('btnAdmin').style.borderColor=adminMode?'#E53E3E':'#F5A800';
  document.getElementById('btnAdmin').style.color=adminMode?'#E53E3E':'#F5A800';
  const app=document.getElementById('app');
  if(screen==='admin') app.innerHTML=renderAdmin();
  else if(screen==='lista') app.innerHTML=renderLista();
  else if(screen==='editor') app.innerHTML=renderEditor();
  // Setup desc edit event delegation
  setTimeout(function(){
    document.querySelectorAll('[data-action]').forEach(function(btn){
      btn.addEventListener('click',function(e){
        e.stopPropagation();
        const action=this.dataset.action;
        const id=this.dataset.id;
        if(action==='editDesc') editarDesc(id);
        else if(action==='saveDesc'){
          const ta=document.querySelector('[data-descid="'+id+'"]');
          const item=cur.items.find(i=>i.id===id);
          if(item&&ta) item.descCustom=ta.value;
          editandoDesc=null;render();
        }
        else if(action==='cancelDesc'){editandoDesc=null;render();}
        else if(action==='delItem'){delItem(id);}
        else if(action==='setCorte'){cTipo=this.dataset.val;render();}
        else if(action==='addCorte'){addCorte(cur.tc||'tipo2');}
        else if(action==='subirImg'){subirImagenItem(id);}
        else if(action==='quitarImg'){quitarImagenItem(id);}
        else if(action==='resetDesc'){
          const item=cur.items.find(i=>i.id===id);
          if(item) delete item.descCustom;
          editandoDesc=null;render();
        }
      });
    });
  },50);
  // Inject modals
  const modalHtml=renderCliModal();
  if(modalHtml){const m=document.createElement('div');m.id='cliModalWrap';m.innerHTML=modalHtml;document.body.appendChild(m);}
  else{const old=document.getElementById('cliModalWrap');if(old)old.remove();}

  // Restore scroll positions after re-render
  document.querySelectorAll('.list').forEach(el=>{if(el.id&&scrolls[el.id])el.scrollTop=scrolls[el.id];});
}

function nuevaCot(){
  const hoy=new Date().toISOString().slice(0,10);cur={id:null,num:'',fecha:hoy,cli:'',cont:'',tc:'tipo2',proyecto:'',notas:'',items:[]};
  vTab='info'; screen='editor'; resetVinilo(); render();
}
function abrirCot(id){cur={...cots.find(c=>c.id===id)};vTab='info';screen='editor';resetVinilo();render();}
async function eliminarCot(id){if(!confirm('¿Eliminar esta cotización?'))return;cots=cots.filter(c=>c.id!==id);await saveCots();deleteCotizacionFromGS(id);render();}
async function guardarCot(){
  if(!cur.id){cur={...cur,id:uid()};cots=[...cots,cur];}
  else cots=cots.map(c=>c.id===cur.id?cur:c);
  await saveCots();
  pushCotizacionToGS(cur);
  alert('✅ Cotización guardada');render();
}
function resetVinilo(){selP=[];selM=[];dosCarasSet=new Set();bP='';bM='';vAncho='';vAlto='';vUnid='1';vCant='1';vRef='';vRefSencillo='0';vRefPS='0';vRefCarton='0';vMOHoras='0';vMOMinutos='0';vCintaDelgada='0';vCintaAcolchada='0';vCintaDelgadaUnit='cm';vCintaAcolchadaUnit='cm';sCatP='Todos';sCatM='Todos';}
function resetLaser(){lCant='1';lRef='';lRefSencillo='0';lMOHoras='0';lMOMinutos='0';lCintaDelgada='0';lCintaAcolchada='0';lCintaDelgadaUnit='cm';lCintaAcolchadaUnit='cm';selAcabados=[];}

function renderEditor(){
  const d=DESC[cur.tc]||1;
  const total=(cur.items||[]).reduce((s,i)=>s+calcI(i,d),0);
  const tabs=['info','vinilo','laser','otros','corte','empaque','resumen'];

 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2\"/><rect x=\"9\" y=\"3\" width=\"6\" height=\"4\" rx=\"1\"/><path d=\"M9 12h6\"/><path d=\"M9 16h4\"/></svg>'];
  const tabsHtml=tabs.map((t,i)=>
    `<button onclick="setTab('${t}')" style="
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:4px;padding:12px 8px;border:2px solid ${vTab===t?'#F5A800':'#E8E8E8'};
      border-radius:10px;background:${vTab===t?'#F5A80022':'#fff'};
      cursor:pointer;font-family:inherit;transition:all .15s;flex:1;min-width:0;
    ">
      <span style="display:flex;align-items:center;justify-content:center;width:24px;height:24px">${tabIcons[i]}</span>
      <span style="font-size:10px;font-weight:${vTab===t?'800':'600'};color:${vTab===t?'#1A1A1A':'#5A5A5A'};text-align:center;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%">${tabLabels[i].replace(/^[^\s]+ /,'')}</span>
    </button>`
  ).join('');
  let content='';
  if(vTab==='info') content=renderInfo();
  else if(vTab==='vinilo') content=renderVinilo(d);
  else if(vTab==='laser') content=renderLaser(d);
  else if(vTab==='otros') content=renderOtros(d);
  else if(vTab==='empaque') content=renderEmpaque();
  else if(vTab==='corte') content=renderCorte(d);

      <button class="btn" onclick="guardarCot()">Guardar</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px">${tabsHtml}</div>
    ${content}
  </div>`;
}

  return `<div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <h3 style="margin:0;font-size:16px;font-weight:800">Datos del cliente</h3>

        <button onclick="guardarClienteDesdeForm()" style="background:#2D2D2D;color:#fff;border:none;border-radius:6px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">+ Guardar</button>

      <div><label>Tipo de cliente</label><select onchange="cur.tc=this.value">${Object.entries(TLBL).map(([k,v])=>`<option value="${k}"${cur.tc===k?' selected':''}>${v}</option>`).join('')}</select></div>
      <div style="grid-column:1/-1"><label>Nombre del proyecto</label><input value="${cur.proyecto||''}" oninput="cur.proyecto=this.value" placeholder="Ej: Pendones feria 2025, Tarjetas corporativas..."></div>

}

function renderVinilo(d){
  const catsP=["Todos",...new Set(PR.map(p=>p.cat))];
  const catsM=["Todos",...new Set(MT.map(m=>m.c))];
  const fP=PR.filter(p=>(sCatP==="Todos"||p.cat===sCatP)&&p.n.toLowerCase().includes(bP.toLowerCase()));
  const fM=MT.filter(m=>(sCatM==="Todos"||m.c===sCatM)&&m.n.toLowerCase().includes(bM.toLowerCase()));
  const selItems=[...PR.filter(p=>selP.includes(p.id)),...MT.filter(m=>selM.includes(m.id))];
  const cm2=(parseFloat(vAncho)||0)*(parseFloat(vAlto)||0)*(parseFloat(vUnid)||1);
  const ptCm2=selItems.reduce((s,i)=>s+i.p,0);
  const ptCm2Total=selItems.reduce((s,i)=>s+i.p*(dosCarasSet.has(i.id)?2:1),0);
  const prev=cm2*ptCm2Total*(parseInt(vCant)||1)*d;
  const ivs=(cur.items||[]).filter(i=>i.tipo==="vinilo");

  const listP=fP.map(p=>`<div class="list-item${selP.includes(p.id)?' sel':''}" data-id="${p.id}" data-list="P" onclick="togP('${p.id}')">
    <div style="display:flex;align-items:center;flex:1">
      <span class="chk${selP.includes(p.id)?' on':''}"></span>
      <span class="iname${selP.includes(p.id)?' on':''}">${p.n}</span>
    </div>
    <span class="iprice">${fmtCm2(p.p)}/cm²</span>

  </div>`).join('');

  const listM=fM.map(m=>`<div class="list-item${selM.includes(m.id)?' sel':''}" data-id="${m.id}" data-list="M" onclick="togM('${m.id}')">
    <div style="display:flex;align-items:center;flex:1">
      <span class="chk${selM.includes(m.id)?' on':''}"></span>
      <span class="iname${selM.includes(m.id)?' on':''}">${m.n}</span>
    </div>
    <span class="iprice">${fmtCm2(m.p)}/cm²</span>

  </div>`).join('');

  const filtBtnsP=catsP.map(c=>`<button class="filt${sCatP===c?' on':''}" onclick="sCatP='${c}';render()">${c}</button>`).join('');
  const filtBtnsM=catsM.map(c=>`<button class="filt${sCatM===c?' on':''}" onclick="sCatM='${c}';render()">${c}</button>`).join('');

  const selBox=`<div class="sel-box" id="selBox" style="display:${selItems.length?'block':'none'}"><p style="font-size:11px;font-weight:700;text-transform:uppercase;color:#5A5A5A;margin-bottom:6px">Seleccionados (${selItems.length})</p><div>${selItems.map(i=>`<span class="sel-tag">${i.n} <span style="color:#5A5A5A">(${fmtCm2(i.p)}${dosCarasSet.has(i.id)?' ×2':''})</span></span>`).join('')}</div></div>`;

  const prevBox=(selItems.length&&vAncho&&vAlto)?`<div class="preview">${cm2.toLocaleString('es-CO')} cm² × ${fmtCm2(ptCm2)}/cm² × ${vCant} = <strong>${fmt(prev)}</strong></div>`:'';

  const ivsHtml=ivs.map(item=>{
    const cm2i=item.ancho*item.alto*(item.unid||1);
    return`<div class="item-row">
      ${item.img?`<img src="${item.img}" style="width:56px;height:56px;object-fit:cover;border-radius:6px;flex-shrink:0;margin-right:4px">`:''} 
      <div style="flex:1">
        ${item.ref?'<p style="margin:0 0 4px;font-size:12px;font-weight:800;color:#D4900A">'+item.ref+'</p>':''}
        <div class="tags">${item.subs.map(s=>`<span class="tag">${s.n}</span>`).join('')}</div>
        <p style="font-size:12px;color:#5A5A5A;margin:2px 0">${item.ancho}×${item.alto}cm · ${cm2i.toLocaleString('es-CO')} cm² · ×${item.cant}</p>
        ${(item.refilados&&item.refilados.length)?'<div style="margin-top:3px">'+item.refilados.map(r=>'<span class="tag" style="background:#e8f4e8">'+r.n+': '+r.cortes+' cortes</span>').join('')+'</div>':''}
        <div style="margin-top:6px">
          ${item.img
            ?`<button onclick="quitarImagenItem('${item.id}')" style="background:none;border:1px solid #E8E8E8;border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer;color:#E53E3E">✕ Quitar imagen</button>`
            :`<button onclick="subirImagenItem('${item.id}')" style="background:none;border:1px solid #E8E8E8;border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer;color:#5A5A5A">📷 Agregar imagen</button>`
          }
        </div>
      </div>
      <span style="font-weight:700;font-size:14px;flex-shrink:0">${fmt(calcI(item,d))}</span>
      <button class="del" onclick="delItem('${item.id}')">×</button>
    </div>`;
  }).join('');

  return `<div class="card" style="margin-bottom:16px">
    <h3>Agregar ítem — Vinilos / Impresión digital</h3>
    <p class="sub">Selecciona uno o varios procesos y/o materiales con las mismas dimensiones.</p>

function togDosCaras(id,btn){
  if(dosCarasSet.has(id)){dosCarasSet.delete(id);if(btn)btn.style.background='#E8E8E8';}
  else{dosCarasSet.add(id);if(btn)btn.style.background='#F5A800';}
  updateSelBox();updatePreview();
}

function togP(id){
  selP=selP.includes(id)?selP.filter(x=>x!==id):[...selP,id];
  const el=document.querySelector(`[data-id="${id}"][data-list="P"]`);
  if(el){
    const on=selP.includes(id);
    el.classList.toggle('sel',on);
    const chk=el.querySelector('.chk');
    const nm=el.querySelector('.iname');
    if(chk){chk.classList.toggle('on',on);}
    if(nm){nm.classList.toggle('on',on);}
    // Add/remove ×2 button
    let btn=el.querySelector('.btn-x2');
    if(on&&!btn){
      btn=document.createElement('button');
      btn.className='btn-x2';
      btn.textContent='×2';
      btn.style.cssText='margin-left:6px;background:#E8E8E8;border:none;border-radius:4px;padding:2px 7px;font-size:11px;font-weight:800;cursor:pointer;flex-shrink:0';
      btn.onclick=function(e){e.stopPropagation();togDosCaras(id,btn);};
      el.appendChild(btn);
    } else if(!on&&btn){
      btn.remove();
      dosCarasSet.delete(id);
    }
  }
  updateSelBox();updatePreview();
}
function togM(id){
  selM=selM.includes(id)?selM.filter(x=>x!==id):[...selM,id];
  const el=document.querySelector(`[data-id="${id}"][data-list="M"]`);

    const on=selM.includes(id);

function updateSelBox(){
  const selItems=[...PR.filter(p=>selP.includes(p.id)),...MT.filter(m=>selM.includes(m.id))];
  const box=document.getElementById('selBox');
  if(!box)return;
  if(selItems.length){
    box.innerHTML=`<p style="font-size:11px;font-weight:700;text-transform:uppercase;color:#5A5A5A;margin-bottom:6px">Seleccionados (${selItems.length})</p><div>${selItems.map(i=>`<span class="sel-tag">${i.n} <span style="color:#5A5A5A">(${fmtCm2(i.p)}${dosCarasSet.has(i.id)?' ×2':''})</span></span>`).join('')}</div>`;
    box.style.display='block';
  } else {
    box.innerHTML='';box.style.display='none';
  }
  const btn=document.getElementById('btnAddVinilo');
  if(btn) btn.disabled=(!selItems.length||!vAncho||!vAlto);
}

function updateSelBoxAcabados(){
  const sel=ACABADOS.filter(a=>selAcabados.includes(a.id));
  const box=document.getElementById('selBoxAcabados');
  const cnt=document.getElementById('cntAcabados');
  if(cnt) cnt.textContent=selAcabados.length;
  if(!box)return;
  if(sel.length){
    box.innerHTML=`<p style="font-size:11px;font-weight:700;text-transform:uppercase;color:#5A5A5A;margin-bottom:6px">Acabados seleccionados</p><div>${sel.map(a=>`<span class="sel-tag">${a.n} <span style="color:#5A5A5A">${a.p[lTam]?fmtCm2(a.p[lTam]):'N/D'}</span></span>`).join('')}</div>`;
    box.style.display='block';
  } else {
    box.innerHTML='';box.style.display='none';
  }
}

function updateLaserPreview(){
  const fam=LPAP[lFi];const gr=fam?.g[lGi];
  const pP=gr?.p[lTam]||0;const pI=LBASE[lMod]?.[lTam]||0;
  const d=DESC[cur.tc]||1;
  const acabadosTotal=ACABADOS.filter(a=>selAcabados.includes(a.id)).reduce((s,a)=>s+(a.p[lTam]||0),0);
  const sub=(pI+pP+acabadosTotal)*(parseInt(lCant)||1)*d;
  const box=document.getElementById('laserPreview');
  if(box){
    const acEl=box.querySelector('#prevAcabados');
    const totEl=box.querySelector('#prevTotal');
    if(acEl) acEl.textContent=fmt(acabadosTotal);
    if(totEl) totEl.textContent=fmt(sub);
  }
}

function updatePreview(){
  const selItems=[...PR.filter(p=>selP.includes(p.id)),...MT.filter(m=>selM.includes(m.id))];
  const cm2=(parseFloat(vAncho)||0)*(parseFloat(vAlto)||0)*(parseFloat(vUnid)||1);
  const ptCm2=selItems.reduce((s,i)=>s+i.p,0);
  const d=DESC[cur.tc]||1;
  const ptCm2Total=selItems.reduce((s,i)=>s+i.p*(dosCarasSet.has(i.id)?2:1),0);
  const prev=cm2*ptCm2Total*(parseInt(vCant)||1)*d;
  const box=document.getElementById('previewBox');
  const btn=document.getElementById('btnAddVinilo');
  if(box){
    if(selItems.length&&vAncho&&vAlto){
      box.innerHTML=`<div class="preview">${cm2.toLocaleString('es-CO')} cm² × ${fmtCm2(ptCm2)}/cm² × ${vCant} = <strong>${fmt(prev)}</strong></div>`;
    } else {
      box.innerHTML='';
    }
  }
  if(btn) btn.disabled=(!selItems.length||!vAncho||!vAlto);
}

function addVinilo(){
  const selItems=[...PR.filter(p=>selP.includes(p.id)),...MT.filter(m=>selM.includes(m.id))];
  if(!selItems.length||!vAncho||!vAlto)return;
  const refilados=[];
  if(parseFloat(vRefSencillo)>0) refilados.push({tipo:'sencillo',n:'Refilado sencillo',cortes:parseFloat(vRefSencillo),costo:172.97});
  if(parseFloat(vRefPS)>0) refilados.push({tipo:'ps',n:'Refilado poliestireno',cortes:parseFloat(vRefPS),costo:356.76});
  if(parseFloat(vRefCarton)>0) refilados.push({tipo:'carton',n:'Refilado cartón industrial',cortes:parseFloat(vRefCarton),costo:713.51});
  const moHoras=(parseFloat(vMOHoras)||0)+(parseFloat(vMOMinutos)||0)/60;
  const manoObra=moHoras>0?{horas:parseFloat(vMOHoras)||0,minutos:parseFloat(vMOMinutos)||0,total:moHoras*35000}:null;
  const cintas=[];
  if(parseFloat(vCintaDelgada)>0) cintas.push({tipo:'delgada',n:'Cinta doble faz delgada 12mm',metros:toMetros(vCintaDelgada,vCintaDelgadaUnit),base:1729.7297});
  if(parseFloat(vCintaAcolchada)>0) cintas.push({tipo:'acolchada',n:'Cinta doble faz acolchada 19mm',metros:toMetros(vCintaAcolchada,vCintaAcolchadaUnit),base:2594.5946});
  const item={id:uid(),tipo:"vinilo",ref:vRef,subs:selItems.map(i=>({id:i.id,n:i.n,p:i.p,dosCaras:dosCarasSet.has(i.id)})),ancho:parseFloat(vAncho),alto:parseFloat(vAlto),unid:parseFloat(vUnid)||1,cant:parseInt(vCant)||1,refilados,cintas,manoObra};
  cur.items=[...cur.items,item];
  resetVinilo();render();
}
function delItem(id){cur.items=cur.items.filter(i=>i.id!==id);render();}

            <select onchange="lCintaAcolchadaUnit=this.value;updateLaserPreview()" style="width:64px;flex-shrink:0;border:1.5px solid #E8E8E8;border-radius:6px;padding:9px 6px;font-size:13px;font-family:inherit;outline:none"><option value="cm" ${lCintaAcolchadaUnit==="cm"?"selected":""}>cm</option><option value="m" ${lCintaAcolchadaUnit==="m"?"selected":""}>m</option></select>
          </div>
        </div>
      </div>
    </div>
    <div style="margin-bottom:12px;background:#f8f8f8;border-radius:8px;padding:12px 14px">
      <p style="margin:0 0 8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#5A5A5A">Mano de obra ($35.000/hora)</p>
      <div class="grid2" style="gap:12px">
        <div><label>Horas</label><input type="number" inputmode="decimal" value="${lMOHoras}" oninput="lMOHoras=this.value" onfocus="if(this.value=='0')this.value='';this.style.borderColor='#F5A800'" onblur="if(this.value=='')this.value='0';this.style.borderColor='#E8E8E8';updateLaserPreview()" placeholder="0" min="0" style="width:100%;border:1.5px solid #E8E8E8;border-radius:6px;padding:9px 12px;font-size:14px;font-family:inherit;outline:none"></div>
        <div><label>Minutos</label><input type="number" inputmode="decimal" value="${lMOMinutos}" oninput="lMOMinutos=this.value" onfocus="if(this.value=='0')this.value='';this.style.borderColor='#F5A800'" onblur="if(this.value=='')this.value='0';this.style.borderColor='#E8E8E8';updateLaserPreview()" placeholder="0" min="0" style="width:100%;border:1.5px solid #E8E8E8;border-radius:6px;padding:9px 12px;font-size:14px;font-family:inherit;outline:none"></div>
      </div>
    </div>
    <div class="list" id="listAcabados" style="margin-bottom:16px">
      ${ACABADOS.map(a=>`<div class="list-item${selAcabados.includes(a.id)?' sel':''}" data-id="${a.id}" data-list="AC" onclick="togAcabado('${a.id}')">
        <div style="display:flex;align-items:center;flex:1">
          <span class="chk${selAcabados.includes(a.id)?' on':''}"></span>
          <span class="iname${selAcabados.includes(a.id)?' on':''}">${a.n}</span>
        </div>
        <span class="iprice">${a.p[lTam]?fmt(a.p[lTam]):'N/D'}</span>
      </div>`).join('')}
    </div>
    <div class="sel-box" id="selBoxAcabados" style="margin-bottom:16px;display:${selAcabados.length?'block':'none'}"><p style="font-size:11px;font-weight:700;text-transform:uppercase;color:#5A5A5A;margin-bottom:6px">Acabados seleccionados</p><div>${ACABADOS.filter(a=>selAcabados.includes(a.id)).map(a=>`<span class="sel-tag">${a.n} <span style="color:#5A5A5A">${a.p[lTam]?fmtCm2(a.p[lTam]):'N/D'}</span></span>`).join('')}</div></div>
    <div class="preview" id="laserPreview" style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;margin-bottom:16px">
      <div><p style="font-size:11px;color:#5A5A5A;margin-bottom:4px">IMPRESIÓN</p><strong>${fmt(pI)}</strong></div>
      <div><p style="font-size:11px;color:#5A5A5A;margin-bottom:4px">PAPEL</p><strong>${pP?fmt(pP):'N/D'}</strong></div>
      <div><p style="font-size:11px;color:#5A5A5A;margin-bottom:4px">ACABADOS</p><strong id="prevAcabados">${fmt(ACABADOS.filter(a=>selAcabados.includes(a.id)).reduce((s,a)=>s+(a.p[lTam]||0),0))}</strong></div>
      <div><p style="font-size:11px;color:#5A5A5A;margin-bottom:4px">TOTAL ×${lCant}</p><strong id="prevTotal" style="font-size:16px">${fmt(sub)}</strong></div>
    </div>
    <button class="btn" onclick="addLaser()">+ Agregar ítem</button>
  </div>
  ${ils.length?`<div class="card"><h3>Ítems láser (${ils.length})</h3>${ilsHtml}</div>`:''}`;
}

function addLaser(){
  const fam=LPAP[lFi];const gr=fam?.g[lGi];
  const pP=gr?.p[lTam]||0;const pI=LBASE[lMod]?.[lTam]||0;
  const acabadosSel=ACABADOS.filter(a=>selAcabados.includes(a.id)).map(a=>({id:a.id,n:a.n,p:a.p[lTam]||0}));
  const nombre=`${LMOD.find(m=>m.id===lMod)?.n} · ${lTam} · ${fam.f}${gr?.gr?' '+gr.gr+'gr':''}`;
  const lRefilados=[];
  if(parseFloat(lRefSencillo)>0) lRefilados.push({tipo:'sencillo',n:'Refilado sencillo',cortes:parseFloat(lRefSencillo),costo:172.97});
  const lMOTotalHoras=(parseFloat(lMOHoras)||0)+(parseFloat(lMOMinutos)||0)/60;
  const lManoObra=lMOTotalHoras>0?{horas:parseFloat(lMOHoras)||0,minutos:parseFloat(lMOMinutos)||0,total:lMOTotalHoras*35000}:null;
  const lCintas=[];
  if(parseFloat(lCintaDelgada)>0) lCintas.push({tipo:'delgada',n:'Cinta doble faz delgada 12mm',metros:toMetros(lCintaDelgada,lCintaDelgadaUnit),base:1729.7297});
  if(parseFloat(lCintaAcolchada)>0) lCintas.push({tipo:'acolchada',n:'Cinta doble faz acolchada 19mm',metros:toMetros(lCintaAcolchada,lCintaAcolchadaUnit),base:2594.5946});
  cur.items=[...cur.items,{id:uid(),tipo:"laser",ref:lRef,nombre,mod:lMod,tam:lTam,fam:fam.f,gr:gr?.gr,pPap:pP,pImp:pI,acabados:acabadosSel,refilados:lRefilados,cintas:lCintas,manoObra:lManoObra,cant:parseInt(lCant)||1}];
  resetLaser();render();
}
function togAcabado(id){
  selAcabados=selAcabados.includes(id)?selAcabados.filter(x=>x!==id):[...selAcabados,id];
  const el=document.querySelector(`[data-id="${id}"][data-list="AC"]`);
  if(el){
    const on=selAcabados.includes(id);
    el.classList.toggle('sel',on);
    const chk=el.querySelector('.chk');
    const nm=el.querySelector('.iname');
    if(chk){chk.classList.toggle('on',on);}
    if(nm){nm.classList.toggle('on',on);}
  }
  updateSelBoxAcabados();updateLaserPreview();
}

function renderResumen(d,total){
  const iv=(cur.items||[]).filter(i=>i.tipo==="vinilo");
  const io=(cur.items||[]).filter(i=>i.tipo==="otros");
  const ie=(cur.items||[]).filter(i=>i.tipo==="empaque");
  const ic=(cur.items||[]).filter(i=>i.tipo==="corte");
  const il=(cur.items||[]).filter(i=>i.tipo==="laser");
  const stV=iv.reduce((s,i)=>s+calcI(i,d),0);
  const stL=il.reduce((s,i)=>s+calcI(i,d),0);
  const ivHtml=iv.map(item=>{
    const refHtml=item.ref?'<p style="margin:0 0 2px;font-size:12px;font-weight:800;color:#D4900A">'+item.ref+'</p>':'';
    const descAuto=item.subs.map(function(s){return s.n+(s.dosCaras?' (×2)':'');}).join(' + ');
    const desc=item.descCustom||descAuto;
    const isEditing=editandoDesc===item.id;
    const editBtn='<button data-action="editDesc" data-id="'+item.id+'" style="background:none;border:none;cursor:pointer;font-size:14px;margin-left:4px;color:#5A5A5A">✏️</button>';
    const saveBtn='<button data-action="saveDesc" data-id="'+item.id+'" style="background:#F5A800;border:none;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer">✓ Guardar</button>';
    const cancelBtn='<button data-action="cancelDesc" data-id="'+item.id+'" style="background:#E8E8E8;border:none;border-radius:4px;padding:4px 10px;font-size:11px;cursor:pointer">Cancelar</button>';
    const resetBtn=item.descCustom?'<button data-action="resetDesc" data-id="'+item.id+'" style="background:none;border:none;font-size:11px;cursor:pointer;color:#E53E3E">Restablecer</button>':'';
    let descHtml='';
    if(isEditing){
      descHtml='<textarea data-descid="'+item.id+'" style="width:100%;border:1.5px solid #F5A800;border-radius:6px;padding:8px;font-size:12px;font-family:inherit;outline:none;resize:vertical;min-height:60px">'+desc+'</textarea>'
        +'<div style="display:flex;gap:6px;margin-top:4px">'+saveBtn+cancelBtn+resetBtn+'</div>';
    } else {
      descHtml='<div style="display:flex;align-items:center;flex:1"><span style="flex:1">'+desc+' <span style="color:#5A5A5A">x'+item.cant+'</span></span>'+editBtn+'</div>';
    }
    return '<div class="sum-row" style="flex-direction:column;align-items:flex-start;gap:4px">'
      +'<div style="display:flex;justify-content:space-between;width:100%;align-items:flex-start">'
      +'<div style="flex:1">'+refHtml+descHtml+'</div>'
      +(isEditing?'':'<span style="font-weight:600;flex-shrink:0;margin-left:8px">'+fmt(calcI(item,d))+'</span>')
      +'</div></div>';
  }).join('');
  const ilHtml=il.map(item=>{
    const refHtml=item.ref?'<p style="margin:0 0 2px;font-size:12px;font-weight:800;color:#D4900A">'+item.ref+'</p>':'';
    const acStr=item.acabados&&item.acabados.length?' + '+item.acabados.map(function(a){return a.n;}).join(' + '):''; const descAuto=item.nombre+acStr;
    const desc=item.descCustom||descAuto;
    const isEditing=editandoDesc===item.id;
    const editBtn='<button data-action="editDesc" data-id="'+item.id+'" style="background:none;border:none;cursor:pointer;font-size:14px;margin-left:4px;color:#5A5A5A">✏️</button>';
    const saveBtn='<button data-action="saveDesc" data-id="'+item.id+'" style="background:#F5A800;border:none;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer">✓ Guardar</button>';
    const cancelBtn='<button data-action="cancelDesc" data-id="'+item.id+'" style="background:#E8E8E8;border:none;border-radius:4px;padding:4px 10px;font-size:11px;cursor:pointer">Cancelar</button>';
    const resetBtn=item.descCustom?'<button data-action="resetDesc" data-id="'+item.id+'" style="background:none;border:none;font-size:11px;cursor:pointer;color:#E53E3E">Restablecer</button>':'';
    let descHtml='';
    if(isEditing){
      descHtml='<textarea data-descid="'+item.id+'" style="width:100%;border:1.5px solid #F5A800;border-radius:6px;padding:8px;font-size:12px;font-family:inherit;outline:none;resize:vertical;min-height:60px">'+desc+'</textarea>'
        +'<div style="display:flex;gap:6px;margin-top:4px">'+saveBtn+cancelBtn+resetBtn+'</div>';
    } else {
      descHtml='<div style="display:flex;align-items:center;flex:1"><span style="flex:1">'+desc+' <span style="color:#5A5A5A">x'+item.cant+'</span></span>'+editBtn+'</div>';
    }
    return '<div class="sum-row" style="flex-direction:column;align-items:flex-start;gap:4px">'
      +'<div style="display:flex;justify-content:space-between;width:100%;align-items:flex-start">'
      +'<div style="flex:1">'+refHtml+descHtml+'</div>'
      +(isEditing?'':'<span style="font-weight:600;flex-shrink:0;margin-left:8px">'+fmt(calcI(item,d))+'</span>')
      +'</div></div>';
  }).join('');

  const iem2=(cur.items||[]).filter(i=>i.tipo==="empaque_mat");
  const stO=io.reduce((s,i)=>s+calcI(i,d),0);
  const stE=ie.reduce((s,i)=>s+calcEmpaque(i).total,0)+iem2.reduce((s,i)=>s+(parseFloat(i.precioUnit)||0)*(parseInt(i.cant)||1)*DESC.tipo1,0);
  const stC=ic.reduce((s,i)=>s+calcCorte(i,d),0);

  const icHtml=ic.map(function(item){
    const tot=calcCorte(item,d);
    const mins=item.subTipo==='cnc'?calcMinutosCNC(item.distancia,item.speed,item.pasadas):parseFloat(item.minutos)||0;
    const desc=item.descCustom||(item.subTipo==='cnc'?'CNC':'Corte Láser')+(item.nombre?' · '+item.nombre:'');
    const isEditing=editandoDesc===item.id;
    let descHtml='';
    if(isEditing){
      descHtml='<textarea data-descid="'+item.id+'" style="width:100%;border:1.5px solid #F5A800;border-radius:6px;padding:8px;font-size:12px;font-family:inherit;outline:none;resize:vertical;min-height:60px">'+desc+'</textarea>'
        +'<div style="display:flex;gap:6px;margin-top:4px">'
        +'<button data-action="saveDesc" data-id="'+item.id+'" style="background:#F5A800;border:none;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer">✓ Guardar</button>'
        +'<button data-action="cancelDesc" data-id="'+item.id+'" style="background:#E8E8E8;border:none;border-radius:4px;padding:4px 10px;font-size:11px;cursor:pointer">Cancelar</button>'
        +(item.descCustom?'<button data-action="resetDesc" data-id="'+item.id+'" style="background:none;border:none;font-size:11px;cursor:pointer;color:#E53E3E">Restablecer</button>':'')
        +'</div>';
    } else {
      descHtml='<div style="display:flex;align-items:center;flex:1"><span style="flex:1">'+(item.ref?'<strong style="color:#D4900A">'+item.ref+'</strong> · ':'')+desc+' · '+mins.toFixed(2)+' min</span>'
        +'<button data-action="editDesc" data-id="'+item.id+'" style="background:none;border:none;cursor:pointer;font-size:14px;margin-left:4px;color:#5A5A5A">✏️</button></div>';
    }
    return '<div class="sum-row" style="flex-direction:column;align-items:flex-start;gap:4px">'
      +'<div style="display:flex;justify-content:space-between;width:100%;align-items:flex-start">'
      +'<div style="flex:1">'+descHtml+'</div>'
      +(isEditing?'':'<span style="font-weight:600;flex-shrink:0;margin-left:8px">'+fmt(tot)+'</span>')
      +'</div></div>';
  }).join('');

  const ieHtml=ie.map(function(item){
    const calc=calcEmpaque(item);
    const carton=CARTONES.find(c=>c.id===item.cartonId)||CARTONES[0];
    return '<div class="sum-row"><span>'+(item.ref?'<strong style="color:#D4900A">'+item.ref+'</strong> · ':'')+carton.n+' '+item.largo+'×'+item.ancho+'×'+item.alto+' cm ×'+item.cant+'</span><span style="font-weight:600">'+fmt(calc.total)+'</span></div>';
  }).join('');

  const iemHtml=iem2.map(function(item){
    const tot=(parseFloat(item.precioUnit)||0)*(parseInt(item.cant)||1)*DESC.tipo1;
    return '<div class="sum-row"><span>'+item.nombre+' ×'+item.cant+'</span><span style="font-weight:600">'+fmt(tot)+'</span></div>';
  }).join('');

  return '<div class="card" style="margin-bottom:16px">'
    +'<h3 style="margin:0 0 16px">Resumen</h3>'
    +'<div class="grid2" style="margin-bottom:20px">'
    +'<div class="info-box"><p class="lbl">Cliente</p><p class="val">'+(cur.cli||'—')+'</p>'+(cur.proyecto?'<p style="font-size:12px;color:#D4900A;font-weight:600;margin-top:4px">'+cur.proyecto+'</p>':'')+'</div>'
    +'<div class="info-box"><p class="lbl">Tipo</p><p class="val" style="font-size:13px">'+(TLBL[cur.tc]||'—')+'</p></div>'
    +'</div>'
    +(iv.length?'<p style="font-size:12px;font-weight:700;text-transform:uppercase;color:#5A5A5A;margin-bottom:8px">Vinilos / Impresión digital</p>'+ivHtml+'<div class="sum-sub">Subtotal: '+fmt(stV)+'</div>':'')
    +(il.length?'<p style="font-size:12px;font-weight:700;text-transform:uppercase;color:#5A5A5A;margin-bottom:8px;margin-top:8px">Impresión Láser</p>'+ilHtml+'<div class="sum-sub">Subtotal: '+fmt(stL)+'</div>':'')
    +(io.length?'<p style="font-size:12px;font-weight:700;text-transform:uppercase;color:#5A5A5A;margin-bottom:8px;margin-top:8px">Otros productos / servicios</p>'+ioHtml+'<div class="sum-sub">Subtotal: '+fmt(stO)+'</div>':'')
    +((ie.length||iem2.length)?'<p style="font-size:12px;font-weight:700;text-transform:uppercase;color:#5A5A5A;margin-bottom:8px;margin-top:8px">Empaque</p>'+ieHtml+iemHtml+'<div class="sum-sub">Subtotal: '+fmt(stE)+'</div>':'')
    +(ic.length?'<p style="font-size:12px;font-weight:700;text-transform:uppercase;color:#5A5A5A;margin-bottom:8px;margin-top:8px">Corte Láser y CNC</p>'+icHtml+'<div class="sum-sub">Subtotal: '+fmt(stC)+'</div>':'')
    +'<div class="total-bar"><span>TOTAL</span><span>'+fmt(total)+'</span></div>'
    +'</div>'
    +'<div style="display:flex;gap:12px">'
    +'<button class="btn" style="flex:1" onclick="guardarCot()">💾 Guardar</button>'
    +'<button class="btn btn-sec" style="flex:1" onclick="verPDF()">📄 Ver PDF</button>'
    +'</div>';
}

function verPDF(){
  genPDF();
  // Show PDF in a full-screen overlay with iframe
  let overlay=document.getElementById('pdfOverlay');
  if(!overlay){
    overlay=document.createElement('div');
    overlay.id='pdfOverlay';
    overlay.style.cssText='position:fixed;inset:0;z-index:999;background:#fff;display:flex;flex-direction:column';
    const bar=document.createElement('div');
    bar.style.cssText='background:#1A1A1A;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0';
    bar.innerHTML='<button onclick="document.getElementById(\'pdfOverlay\').remove()" style="background:#F5A800;border:none;border-radius:6px;padding:8px 16px;font-weight:700;cursor:pointer;font-family:inherit">← Volver</button>'
      +'<span style="color:#fff;font-weight:700;font-size:14px">Vista previa PDF</span>';
    const iframe=document.createElement('iframe');
    iframe.id='pdfFrame';
    iframe.style.cssText='flex:1;border:none;width:100%';
    overlay.appendChild(bar);
    overlay.appendChild(iframe);
    document.body.appendChild(overlay);
  }
  const iframe=document.getElementById('pdfFrame');
  iframe.srcdoc=window._pdfHtml;
}


// ── ADMIN ────────────────────────────────────────────────────────
function toggleAdmin(){
  if(adminMode){adminMode=false;screen='lista';render();return;}
  document.getElementById('pinModal').style.display='flex';
  setTimeout(()=>document.getElementById('pinInput').focus(),100);
}
function closePinModal(){
  document.getElementById('pinModal').style.display='none';
  document.getElementById('pinInput').value='';
  document.getElementById('pinError').style.display='none';
}
function checkPin(){
  const pin=document.getElementById('pinInput').value;
  if(pin===ADMIN_PIN){
    closePinModal();adminMode=true;screen='admin';render();
  } else {
    document.getElementById('pinError').style.display='block';
    document.getElementById('pinInput').value='';
    document.getElementById('pinInput').focus();
  }
}

function renderAdmin(){
  document.getElementById('btnNueva').style.display='none';
  const tabs=[
    {id:'procesos',l:'⚙️ Procesos'},
    {id:'materiales',l:'🎨 Materiales vinilos'},
    {id:'papeles',l:'🖨️ Papeles láser'},
    {id:'acabados',l:'✨ Acabados láser'},
    {id:'clientes',l:'👤 Clientes'},
  ];
  const tabsHtml=tabs.map(t=>`<button class="tab${adminTab===t.id?' active':''}" onclick="adminTab='${t.id}';render()">${t.l}</button>`).join('');
  
  let content='';
  if(adminTab==='procesos') content=renderAdminList(PR,'procesos','cat');
  if(adminTab==='materiales') content=renderAdminList(MT,'materiales','c');
  if(adminTab==='papeles') content=renderAdminPapeles();
  if(adminTab==='acabados') content=renderAdminAcabados();
  if(adminTab==='clientes') content=renderAdminClientes();

  return `<div style="max-width:860px;margin:0 auto">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px">
      <h2 style="flex:1;font-size:20px;color:#fff">⚙️ Panel de administración</h2>
      <button class="btn" style="background:#2D2D2D;color:#fff" onclick="adminMode=false;screen='lista';render()">← Salir</button>
    </div>
    <div class="tabs" style="overflow-x:auto;flex-wrap:nowrap;white-space:nowrap">${tabsHtml}</div>
    ${content}
  </div>`;
}

function renderAdminList(arr, storageKey, catKey){
  const cats=["Todos",...new Set(arr.map(i=>i[catKey]))];
  const filtCat=window._admCat||'Todos';
  const filtQ=window._admQ||'';
  const filt=arr.filter(i=>(filtCat==='Todos'||i[catKey]===filtCat)&&i.n.toLowerCase().includes(filtQ.toLowerCase()));
  
  const rows=filt.map(item=>`
    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #E8E8E8">
      <div style="flex:1;min-width:0">

        <p style="margin:2px 0 0;font-size:11px;color:#5A5A5A">${item[catKey]}</p>
      </div>
      <span style="font-size:13px;font-weight:700;flex-shrink:0;min-width:80px;text-align:right">${fmtCm2(item.p)}/cm²</span>
      <button onclick="openEditItem('${storageKey}','${item.id}')" style="background:#F5A800;border:none;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer">Editar</button>
      <button onclick="deleteItem('${storageKey}','${item.id}')" style="background:none;border:none;cursor:pointer;color:#E53E3E;font-size:18px">×</button>
    </div>`).join('');

  return `<div class="card">
    <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">
      <input value="${filtQ}" oninput="window._admQ=this.value" onblur="render()" placeholder="Buscar..." style="flex:1;min-width:140px;border:1.5px solid #E8E8E8;border-radius:6px;padding:8px 12px;font-size:13px;font-family:inherit;outline:none">
      <select onchange="window._admCat=this.value;render()" style="border:1.5px solid #E8E8E8;border-radius:6px;padding:8px 12px;font-size:13px;font-family:inherit;outline:none">
        ${cats.map(c=>`<option value="${c}"${filtCat===c?' selected':''}>${c}</option>`).join('')}
      </select>
      <button class="btn btn-sm" onclick="openNewItem('${storageKey}')">+ Nuevo</button>
    </div>
    <div style="max-height:420px;overflow-y:auto">${rows}</div>
  </div>
  ${renderAdminModal()}`;
}

function renderAdminPapeles(){
  const rows=LPAP.map((fam,fi)=>fam.g.map((gr,gi)=>`
    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #E8E8E8">
      <div style="flex:1">
        <p style="margin:0;font-size:13px;font-weight:600">${fam.f} ${gr.gr?gr.gr+'gr':''}</p>
        <p style="margin:2px 0 0;font-size:11px;color:#5A5A5A">C:${fmt(gr.p.carta)} O:${fmt(gr.p.oficio)} EO:${fmt(gr.p.extraoficio)} T:${fmt(gr.p.tabloide)}</p>
      </div>
      <button onclick="openEditPapel(${fi},${gi})" style="background:#F5A800;border:none;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer">Editar</button>
    </div>`).join('')).join('');
  return `<div class="card"><div style="max-height:420px;overflow-y:auto">${rows}</div></div>${renderAdminModal()}`;
}

function renderAdminAcabados(){
  const rows=ACABADOS.map((a,i)=>`
    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #E8E8E8">
      <div style="flex:1">
        <p style="margin:0;font-size:13px;font-weight:600">${a.n}</p>
        <p style="margin:2px 0 0;font-size:11px;color:#5A5A5A">C:${fmt(a.p.carta)} O:${fmt(a.p.oficio)} T:${fmt(a.p.tabloide)}</p>
      </div>
      <button onclick="openEditAcabado(${i})" style="background:#F5A800;border:none;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer">Editar</button>
    </div>`).join('');
  return `<div class="card"><div style="max-height:420px;overflow-y:auto">${rows}</div></div>${renderAdminModal()}`;
}

function renderAdminModal(){
  if(!window._adminModal) return '';
  const m=window._adminModal;
  let fields='';
  if(m.type==='cliente'){
    const tcOpts=Object.entries(TLBL).map(([k,v])=>'<option value="'+k+'"'+(m.data.tc===k?' selected':'')+'>'+v+'</option>').join('');
    fields='<div style="margin-bottom:12px"><label style="font-size:11px;font-weight:700;color:#5A5A5A;text-transform:uppercase;letter-spacing:.8px;display:block;margin-bottom:4px">Empresa</label>'
      +'<input id="adm_empresa" value="'+(m.data.empresa||'')+'" style="width:100%;border:1.5px solid #E8E8E8;border-radius:6px;padding:9px 12px;font-size:14px;font-family:inherit;outline:none"></div>'
      +'<div style="margin-bottom:12px"><label style="font-size:11px;font-weight:700;color:#5A5A5A;text-transform:uppercase;letter-spacing:.8px;display:block;margin-bottom:4px">Contacto</label>'
      +'<input id="adm_contacto" value="'+(m.data.contacto||'')+'" style="width:100%;border:1.5px solid #E8E8E8;border-radius:6px;padding:9px 12px;font-size:14px;font-family:inherit;outline:none"></div>'
      +'<div><label style="font-size:11px;font-weight:700;color:#5A5A5A;text-transform:uppercase;letter-spacing:.8px;display:block;margin-bottom:4px">Tipo de cliente</label>'
      +'<select id="adm_tc" style="width:100%;border:1.5px solid #E8E8E8;border-radius:6px;padding:9px 12px;font-size:14px;font-family:inherit;outline:none">'+tcOpts+'</select></div>';
  }
  if(m.type==='item'){
    fields='<div style="margin-bottom:12px"><label style="font-size:11px;font-weight:700;color:#5A5A5A;text-transform:uppercase;letter-spacing:.8px;display:block;margin-bottom:4px">Nombre</label>'
      +'<input id="adm_n" value="'+(m.data.n||'')+'" style="width:100%;border:1.5px solid #E8E8E8;border-radius:6px;padding:9px 12px;font-size:14px;font-family:inherit;outline:none"></div>'
      +'<div style="margin-bottom:12px"><label style="font-size:11px;font-weight:700;color:#5A5A5A;text-transform:uppercase;letter-spacing:.8px;display:block;margin-bottom:4px">Categoría</label>'
      +'<input id="adm_cat" value="'+(m.data[m.catKey]||'')+'" style="width:100%;border:1.5px solid #E8E8E8;border-radius:6px;padding:9px 12px;font-size:14px;font-family:inherit;outline:none"></div>'
      +'<div><label style="font-size:11px;font-weight:700;color:#5A5A5A;text-transform:uppercase;letter-spacing:.8px;display:block;margin-bottom:4px">Precio por cm²</label>'
      +'<input id="adm_p" type="number" value="'+(m.data.p||'')+'" style="width:100%;border:1.5px solid #E8E8E8;border-radius:6px;padding:9px 12px;font-size:14px;font-family:inherit;outline:none"></div>';
  }
  const tam=['carta','oficio','extraoficio','tabloide','extratabloide','supertabloide'];
  if(m.type==='papel'||m.type==='acabado'){
    const src=m.type==='papel'?m.data.p:m.data.p;
    fields=tam.map(t=>'<div style="margin-bottom:12px"><label style="font-size:11px;font-weight:700;color:#5A5A5A;text-transform:uppercase;letter-spacing:.8px;display:block;margin-bottom:4px">'+t.charAt(0).toUpperCase()+t.slice(1)+'</label>'
      +'<input id="adm_'+t+'" type="number" value="'+(src[t]||0)+'" style="width:100%;border:1.5px solid #E8E8E8;border-radius:6px;padding:9px 12px;font-size:14px;font-family:inherit;outline:none"></div>').join('');
  }
  return '<div style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;display:flex;align-items:center;justify-content:center">'
    +'<div style="background:#fff;border-radius:16px;padding:28px;max-width:400px;width:90%;max-height:80vh;overflow-y:auto">'
    +'<h3 style="margin:0 0 20px;font-size:16px;font-weight:800">'+m.title+'</h3>'
    +fields
    +'<div style="display:flex;gap:10px;margin-top:20px">'
    +'<button onclick="closeAdminModal()" style="flex:1;background:#E8E8E8;border:none;border-radius:6px;padding:10px;font-weight:700;cursor:pointer;font-family:inherit">Cancelar</button>'
    +'<button onclick="saveAdminModal()" style="flex:1;background:#F5A800;border:none;border-radius:6px;padding:10px;font-weight:700;cursor:pointer;font-family:inherit">Guardar</button>'
    +'</div></div></div>';
}



function openEditItem(storageKey, id){
  const arr=storageKey==='procesos'?PR:MT;
  const catKey=storageKey==='procesos'?'cat':'c';
  const item=arr.find(i=>i.id===id);
  if(!item)return;
  window._adminModal={type:'item',storageKey,id,catKey,data:{...item},title:'Editar: '+item.n};
  render();
}
function openNewItem(storageKey){
  const catKey=storageKey==='procesos'?'cat':'c';
  const newId=storageKey+'_'+uid();
  window._adminModal={type:'item',storageKey,id:null,catKey,data:{id:newId,n:'',p:0,[catKey]:''},title:'Nuevo ítem',isNew:true};
  render();
}
function deleteItem(storageKey,id){
  if(!confirm('¿Eliminar este ítem?'))return;
  if(storageKey==='procesos'){const i=PR.findIndex(x=>x.id===id);if(i>-1)PR.splice(i,1);}
  else{const i=MT.findIndex(x=>x.id===id);if(i>-1)MT.splice(i,1);}
  render();
}
function openEditPapel(fi,gi){
  const fam=LPAP[fi];const gr=fam.g[gi];
  window._adminModal={type:'papel',fi,gi,data:{...gr,p:{...gr.p}},title:'Editar: '+fam.f+' '+(gr.gr?gr.gr+'gr':'')};
  render();
}
function openEditAcabado(idx){
  const a=ACABADOS[idx];
  window._adminModal={type:'acabado',idx,data:{...a,p:{...a.p}},title:'Editar: '+a.n};
  render();
}

function closeAdminModal(){window._adminModal=null;render();}

function saveAdminModal(){
  const m=window._adminModal;
  if(m.type==='cliente'){
    const empresa=document.getElementById('adm_empresa').value.trim();
    const contacto=document.getElementById('adm_contacto').value.trim();
    const tc=document.getElementById('adm_tc').value;
    if(!empresa){alert('El nombre es obligatorio');return;}
    if(m.idx===null){clientes.push({id:uid(),empresa,contacto,tc});}
    else{clientes[m.idx]={...clientes[m.idx],empresa,contacto,tc};}
    saveClientes();
    pushClientesToGS();
    window._adminModal=null;render();return;
  }
  if(m.type==='item'){
    const arr=m.storageKey==='procesos'?PR:MT;
    const n=document.getElementById('adm_n').value.trim();
    const cat=document.getElementById('adm_cat').value.trim();
    const p=parseFloat(document.getElementById('adm_p').value)||0;
    if(!n){alert('El nombre es obligatorio');return;}
    if(m.isNew){arr.push({id:m.data.id,n,p,[m.catKey]:cat});}
    else{const item=arr.find(i=>i.id===m.id);if(item){item.n=n;item.p=p;item[m.catKey]=cat;}}
    savePreciosLocal();pushPreciosToGS();
  } else if(m.type==='papel'){
    const tam=['carta','oficio','extraoficio','tabloide','extratabloide','supertabloide'];
    const gr=LPAP[m.fi].g[m.gi];
    tam.forEach(t=>{const v=parseFloat(document.getElementById('adm_'+t).value)||0;gr.p[t]=v;});
    savePreciosLocal();pushPreciosToGS();
  } else if(m.type==='acabado'){
    const tam=['carta','oficio','extraoficio','tabloide','extratabloide','supertabloide'];
    const a=ACABADOS[m.idx];
    tam.forEach(t=>{const v=parseFloat(document.getElementById('adm_'+t).value)||0;a.p[t]=v;});
    savePreciosLocal();pushPreciosToGS();
  }
  window._adminModal=null;render();
}


// ── INIT ─────────────────────────────────────────────────────────
loadPreciosLocal().then(()=>{
loadCots().then(()=>{
  loadClientes().then(()=>{
    render();
    // Sync from GS in background
    syncPreciosFromGS().then(()=>syncCotizaciones()).then(()=>syncClientes()).then(()=>render());
  });
});
});
</script>
